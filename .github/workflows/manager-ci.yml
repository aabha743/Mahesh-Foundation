name: Manager CI

on:
  pull_request:
    branches: [master]
    paths:
      - "mahesh-meds-manager/**"
      - ".github/workflows/manager-ci.yml"
  # Every master commit is built (no path filter): the deploy downloads the build for the exact commit.
  push:
    branches: [master]

# A new push to the same PR cancels the run it replaces (saves Actions minutes). Each master commit gets
# its own group, so its run is never cancelled or dropped from the queue.
concurrency:
  group: manager-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test and build manager
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mahesh-meds-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mahesh-meds-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # vite build does not type-check, so this is the only place type errors are caught.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Record checksums of the build
        if: github.event_name == 'push'
        run: (cd dist && find . -type f | sort | xargs sha256sum) > dist.sha256

      # What the deploy installs (ops/deploy/build-release.sh fetches it by commit).
      - name: Upload the build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: manager-dist
          path: |
            mahesh-meds-manager/dist/
            mahesh-meds-manager/dist.sha256
          retention-days: 90
          if-no-files-found: error
